[project]
name = "saveb-collector"
version = "1.0.0"
description = "Durable DH-Order collection and ERP projection"
requires-python = ">=3.11"
dependencies = [
  "litestar[standard]==2.24.0",
  "celery[redis]==5.6.3",
  "redis==6.4.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "asyncpg==0.31.0",
  "prometheus-client==0.26.0",
  "tzdata>=2025.1",
  "ddddocr==1.6.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

