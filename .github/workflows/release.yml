name: Production release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Previously healthy full commit SHA to roll back; leave empty to deploy main"
        required: false
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.rollback_sha == '')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment and rollback
        run: python3 deploy/test_release.py
      - name: Image name
        id: meta
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable release
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build
    if: >-
      always() && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' &&
      (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.rollback_sha != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      IMAGE_NAME: ${{ needs.build.outputs.image }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Activate release or roll back
        run: bash deploy/remote.sh
      - name: Release summary
        if: always()
        run: |
          echo "Commit: ${ROLLBACK_SHA:-$GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Database migrations are never automatically reversed." >> "$GITHUB_STEP_SUMMARY"
